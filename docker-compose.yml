services:
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: ccpa_chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local