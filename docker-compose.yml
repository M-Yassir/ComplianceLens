services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ccpa_chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS='["*"]'
    restart: unless-stopped

networks:
  rag-network:
    external: true

volumes:
  chroma_data:
    driver: local