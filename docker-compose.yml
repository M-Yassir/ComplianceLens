services:
  # ---------------------------------------------------------------------------
  # Next.js Frontend Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccpa_rag_frontend
    ports:
      - "4000:4000" # Maps host port 4000 -> container port 3000
    environment:
      - INTERNAL_API_URL=http://api:8000 # Internal Docker DNS
    depends_on:
      - api
    networks:
      - rag-network
    restart: unless-stopped
  # ---------------------------------------------------------------------------
  # FastAPI Application Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: ccpa_rag_api
    ports:
      - "8000:8000"
    env_file:
      - ./RAG/.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LANGFUSE_HOST=http://langfuse-web:3000
    volumes:
      - ./RAG/data:/app/data
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ChromaDB Service
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: ccpa_chroma_db
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    name: rag-network

volumes:
  chroma_data:
    driver: local