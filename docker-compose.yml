services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ccpa_chroma_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - ALLOW_RESET=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  chroma_data:
    driver: local